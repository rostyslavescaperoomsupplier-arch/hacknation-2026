# Jantar Unity crew video calls. Only one public port on this VPS (20240, TCP+UDP forwarded by Mikrus).
# Both callers allocate relays on this host, so media goes relay -> relay inside the VPS and the relay
# ports (local range below) never need to be reachable from outside.
listening-port=20240
listening-ip=192.168.2.140
relay-ip=192.168.2.140
min-port=49160
max-port=49260
allowed-peer-ip=192.168.2.140
denied-peer-ip=0.0.0.0-127.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
use-auth-secret
static-auth-secret=<same value as CREW_TURN_SECRET in /etc/jantar-assistant.env>
realm=jantar.byst.re
fingerprint
no-tls
no-dtls
no-cli
no-multicast-peers
total-quota=60
user-quota=12
max-bps=2000000
log-file=syslog
simple-log
