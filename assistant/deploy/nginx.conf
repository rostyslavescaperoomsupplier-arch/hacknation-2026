# Jantar Unity crew assistant. Public via mikr.us Cloudflare proxy: `domena jantar.byst.re 80`.
# Real client IP: Cloudflare (mikr.us byst.re proxy) sends CF-Connecting-IP; never trust the client's own X-Forwarded-For.
map $http_cf_connecting_ip $ju_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    listen [::]:80;
    server_name jantar.byst.re;
    server_tokens off;
    client_max_body_size 256k;

    access_log /var/log/nginx/jantar.access.log;
    error_log  /var/log/nginx/jantar.error.log;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        # WebSocket (centrala /api/ws, later)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $ju_client_ip;
        # SSE: no buffering, long reads
        proxy_buffering off;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
