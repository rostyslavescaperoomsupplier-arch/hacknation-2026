# Jantar Unity crew assistant. Public via mikr.us Cloudflare proxy: `domena jantar.byst.re 80`.
#
# Real client IP (adversarial report #1): the box is also reachable directly over IPv6, so CF-Connecting-IP is
# trusted ONLY when the request comes from the mikr.us byst.re proxy; anyone else is identified by their own address.
geo $ju_from_proxy {
    default               0;
    2a01:4f9:c012:f2aa::/64 1;   # mikr.us byst.re proxy (seen in jantar.access.log)
}
map "$ju_from_proxy:$http_cf_connecting_ip" $ju_client_ip {
    default        $remote_addr;
    "~^1:(?<cf>.+)$" $cf;
}

server {
    listen 80;
    listen [::]:80;
    server_name jantar.byst.re;
    server_tokens off;
    client_max_body_size 256k;
    client_body_timeout 15s;
    client_header_timeout 10s;

    access_log /var/log/nginx/jantar.access.log;
    error_log  /var/log/nginx/jantar.error.log;

    # report #13: basic security headers (camera/mic/motion are needed by the app itself)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), accelerometer=(self), gyroscope=(self), geolocation=()" always;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        # WebSocket (video chat signalling /crew-video-ws)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # report #14: never pass a client-supplied X-Forwarded-Host
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $ju_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        # SSE: no buffering, long reads
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
